<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Challenger Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090c;
      --bg2: #0e1116;
      --card: #14181f;
      --card2: #1a2029;
      --line: #2a3140;
      --text: #f3f4f0;
      --muted: #8d96a8;
      --lime: #c8f542;
      --lime-dim: rgba(200, 245, 66, .14);
      --heat: #ff4d2e;
      --heat-dim: rgba(255, 77, 46, .16);
      --ice: #7dd3fc;
      --ok: #3dff8a;
      --radius: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    html.lig, body.lig { overflow: hidden; }
    body {
      font-family: Manrope, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: calc(76px + var(--safe-b));
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(200, 245, 66, .08), transparent 50%),
        radial-gradient(800px 400px at 100% 0%, rgba(255, 77, 46, .12), transparent 45%),
        repeating-linear-gradient(-18deg, transparent 0 38px, rgba(255,255,255,.015) 38px 39px);
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 20px 16px 8px; }
    header.top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      margin-bottom: 22px; flex-wrap: wrap;
    }
    .brand .title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800; font-style: italic; letter-spacing: .04em;
      font-size: 28px; line-height: 1; text-transform: uppercase;
      white-space: nowrap;
      background: none; border: 0; color: inherit; cursor: pointer; padding: 0;
    }
    .brand p { color: var(--muted); font-size: 12px; font-weight: 600; margin-top: 2px; }
    .find { position: relative; flex: 1; max-width: 280px; min-width: 0; }
    .find label {
      display: block; font-size: 11px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 4px;
    }
    .find input {
      width: 100%; font-family: inherit; font-weight: 700;
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--text);
      padding: 10px 12px; font-size: 14px;
    }
    .hits {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; max-height: min(50vh, 360px); overflow-y: auto; z-index: 8;
    }
    .hits button {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      width: 100%; text-align: left; font-family: inherit; color: inherit;
      background: transparent; border: 0; border-bottom: 1px solid var(--line);
      padding: 10px 12px; cursor: pointer; font-weight: 700; font-size: 14px;
    }
    .hits button:last-child { border-bottom: 0; }
    .hits button:hover { background: var(--lime-dim); }
    .hits .empty { padding: 10px 12px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.45; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; align-items: start; }
    .card {
      background: linear-gradient(180deg, var(--card), #10141a);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      text-align: left; color: inherit;
      width: 100%;
      display: flex; flex-direction: column;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: rgba(200,245,66,.45); transform: translateY(-1px); }
    .card.on { border-color: var(--lime); box-shadow: 0 0 0 1px var(--lime) inset; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .tname { font-weight: 800; font-size: 16px; }
    .spent { font-variant-numeric: tabular-nums; color: var(--lime); font-weight: 800; }
    .muted { color: var(--muted); font-size: 12px; font-weight: 600; }
    .card .muted { margin-top: 4px; }
    .stars { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .stars span { font-size: 12px; color: #c5ccd8; display: flex; justify-content: space-between; gap: 8px; line-height: 18px; min-height: 18px; }
    .stars span b { font-variant-numeric: tabular-nums; }

    body.lig { overflow: hidden; height: 100dvh; }
    body.lig .wrap {
      height: 100%;
      display: flex; flex-direction: column;
      padding-top: 12px; padding-bottom: 0;
    }
    body.lig header.top { margin-bottom: 8px; flex-shrink: 0; }
    body.lig .sub { font-size: 12px; margin: 0 0 8px; flex-shrink: 0; }
    body.lig #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    body.lig .grid {
      flex: 1; min-height: 0;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px; align-items: stretch;
    }
    body.lig .card { padding: 10px; min-height: 0; overflow: hidden; }
    body.lig .card:hover { transform: none; }
    body.lig .stars { margin-top: 6px; gap: 2px; min-height: 0; overflow: hidden; }
    body.lig .stars span { font-size: 11px; line-height: 15px; min-height: 0; }

    .board-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .board-bar input, .board-bar select { min-width: 0; flex: 1; }
    .board-bar .sal-f { flex: 0 0 84px; }
    .board-head, .brow {
      display: grid; grid-template-columns: 1.3fr 1fr 64px 76px; gap: 8px; align-items: center;
    }
    .board-head button {
      font-family: inherit; font-weight: 800; font-size: 12px; text-align: left;
      background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 6px;
    }
    .board-head button.on { color: var(--lime); }
    .board-head button:nth-child(n+3), .brow .sal, .brow .next { text-align: right; }
    .brow {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; cursor: pointer; text-align: left; color: inherit; width: 100%;
      font-family: inherit; font-weight: 700; font-size: 14px; margin-bottom: 6px;
    }
    .brow:hover { border-color: rgba(200,245,66,.45); }
    .brow .tm { color: var(--muted); font-size: 13px; }
    .board-tot {
      display: grid; grid-template-columns: 1.3fr 1fr 64px 76px; gap: 8px; align-items: center;
      padding: 10px 12px; margin: 8px 0 12px; font-weight: 800; font-size: 14px;
      border-top: 1px solid var(--line);
    }
    .board-tot .next { text-align: right; color: var(--lime); }
    select, .btn, .ghost {
      font-family: inherit; font-weight: 700;
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--text);
      padding: 10px 12px; font-size: 14px;
    }
    select { min-width: 220px; flex: 1; margin-bottom: 0; }
    .side select { margin-bottom: 10px; width: 100%; min-width: 0; }
    .btn {
      background: var(--lime); color: #111; border: 0; cursor: pointer;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .ghost { background: transparent; cursor: pointer; }
    .ghost:hover { border-color: var(--muted); }
    .ghost:disabled { opacity: .4; cursor: not-allowed; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    }
    .stat b {
      display: block; font-family: "Barlow Condensed", sans-serif;
      font-size: 28px; font-weight: 800; line-height: 1; margin-top: 4px;
    }
    .stat.ok b { color: var(--lime); }
    .stat.bad b { color: var(--heat); }

    .plist { display: flex; flex-direction: column; gap: 6px; }
    .prow {
      display: grid; grid-template-columns: 28px 1fr auto auto; gap: 8px; align-items: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px; cursor: pointer; text-align: left; color: inherit; width: 100%;
    }
    .prow.on { border-color: var(--lime); background: var(--lime-dim); }
    .prow.dim { opacity: .38; }
    .prow .nm { font-weight: 700; font-size: 14px; }
    .ck {
      width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line);
      display: grid; place-items: center; font-size: 12px; font-weight: 800;
    }
    .prow.on .ck { background: var(--lime); border-color: var(--lime); color: #111; }
    .sal { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ice); }
    .next { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--lime); min-width: 64px; text-align: right; }
    .tag { font-size: 10px; font-weight: 800; letter-spacing: .04em; color: var(--heat); }

    .drop { margin-top: 16px; }
    .drop h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
    .side { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; min-height: 0; }
    .side .plist { overflow-y: auto; max-height: min(58vh, 620px); padding-bottom: 4px; }
    .verdict {
      position: relative;
      z-index: 2;
      margin-top: 14px; padding: 14px; border-radius: 16px;
      border: 1px solid var(--line); background: #10151c;
    }
    .verdict.yes { border-color: rgba(61,255,138,.5); background: rgba(61,255,138,.08); }
    .verdict.no { border-color: rgba(255,77,46,.5); background: var(--heat-dim); }
    .verdict h3 {
      font-family: "Barlow Condensed", sans-serif; font-size: 32px; font-style: italic;
      letter-spacing: .04em;
    }
    .verdict.yes h3 { color: var(--ok); }
    .verdict.no h3 { color: var(--heat); }
    .bands { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 12px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
    .after { font-size: 13px; font-weight: 700; margin: 10px 0 4px; }
    .verdict > .ghost { margin-top: 10px; }
    .after .hint { margin-top: 4px; }
    .tips { margin: 12px 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .tips h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .tips-row { display: flex; gap: 8px; align-items: stretch; }
    .tips-row .tip { flex: 1; }
    .tips .ghost { flex-shrink: 0; }
    .tip {
      width: 100%; text-align: left; font-family: inherit; font-weight: 700; font-size: 13px;
      background: var(--card2); color: var(--text); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; cursor: default;
    }
    .line { position: relative; height: 28px; margin: 8px 0 4px; }
    .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; background: #2a3340; border-radius: 99px; }
    .rng { position: absolute; top: 8px; height: 12px; border-radius: 99px; opacity: .9; }
    .rng.a { background: var(--lime); }
    .rng.b { background: var(--ice); }
    .ov { position: absolute; top: 6px; height: 16px; background: #fff; mix-blend-mode: overlay; border-radius: 99px; }

    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
      background: #0b0d11; border-top: 1px solid var(--line);
      padding: 8px 8px calc(8px + var(--safe-b));
    }
    nav.tabs button {
      font-family: inherit; font-weight: 800; font-size: 11px;
      background: transparent; color: var(--muted); border: 0;
      padding: 10px 4px; border-radius: 12px; cursor: pointer;
    }
    nav.tabs button.on { color: #111; background: var(--lime); }

    .toast {
      position: fixed; left: 50%; bottom: calc(86px + var(--safe-b));
      transform: translateX(-50%); background: var(--lime); color: #111;
      font-weight: 800; padding: 10px 14px; border-radius: 999px; z-index: 6;
      display: none;
    }
    .hint { font-size: 12px; color: var(--muted); font-weight: 600; }
    .tag.fa { color: var(--heat); }
    .gm {
      background: none; border: 0; padding: 0; cursor: pointer;
      font-family: inherit; font-weight: 800; font-size: 13px;
      color: var(--lime); margin-top: 4px;
    }
    #gate {
      position: fixed; inset: 0; z-index: 10;
      background: var(--bg);
      padding: 28px 16px calc(24px + var(--safe-b));
      overflow-y: auto;
    }
    .gate-in { max-width: 420px; margin: 0 auto; }
    #gate h2 {
      font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-style: italic;
      font-size: 36px; letter-spacing: .04em; text-transform: uppercase;
    }
    .glist { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
    .glist button {
      font-family: inherit; font-weight: 800; font-size: 16px;
      text-align: left; color: inherit; width: 100%;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px; cursor: pointer;
    }
    .glist button:hover, .glist button.on { border-color: var(--lime); }

    .fa-box { display: grid; gap: 12px; max-width: 720px; }
    .fa-row { display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
    .fa-row label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .fa-row input {
      width: 100%; font-family: inherit; font-weight: 700;
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); padding: 10px 12px; font-size: 14px;
    }
    .fa-hits { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .fa-hits button {
      display: flex; justify-content: space-between; gap: 8px;
      width: 100%; text-align: left; font-family: inherit; color: inherit;
      background: var(--card); border: 0; border-bottom: 1px solid var(--line);
      padding: 10px 12px; cursor: pointer; font-weight: 700; font-size: 14px;
    }
    .fa-hits button:last-child { border-bottom: 0; }
    .fa-hits button:hover, .fa-hits button.on { background: var(--lime-dim); }
    .fa-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fa-metrics .card { cursor: default; transform: none; }
    .fa-metrics .card:hover { border-color: var(--line); transform: none; }
    .fa-k { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .fa-v { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-style: italic; font-size: 28px; margin-top: 4px; }
    .fa-v.lime { color: var(--lime); }
    .explain { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 13px; font-weight: 600; line-height: 1.5; }
    .warn { background: var(--heat-dim); border: 1px solid rgba(255,77,46,.4); color: #ffc4b8; padding: 12px 14px; border-radius: 14px; font-size: 13px; font-weight: 600; }

    @media (max-width: 980px) {
      body.lig .grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(4, minmax(0, 1fr));
      }
    }
    @media (max-width: 760px) {
      .cols { grid-template-columns: 1fr; }
      .tips-row { flex-direction: column; }
      .side .plist { max-height: 48vh; }
      .stats { grid-template-columns: 1fr; }
      .fa-metrics { grid-template-columns: 1fr 1fr; }
      .brand .title { font-size: 20px; }
      .find { flex: 1 1 160px; max-width: none; }
      .card { min-height: 0; }
      select { min-width: 0; }
      body.lig .grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(6, minmax(0, 1fr));
      }
      body.lig .stars { display: none; }
      body.lig .tname { font-size: 13px; }
    }
  </style>
</head>

function p(name, nba, pos, salary) {
  return { id: name, name, nba, pos, salary, viaTrade: false, fa: false };
}
function tr(name, nba, pos, salary) {
  return { id: name, name, nba, pos, salary, viaTrade: true, fa: false };
}
function fa(name, nba, pos, salary = null) {
  return { id: name, name, nba, pos, salary, viaTrade: false, fa: true };
}
function hasSal(pl) { return pl.salary != null; }
function bySal(a, b) {
  if (hasSal(a) !== hasSal(b)) return hasSal(a) ? -1 : 1;
  return (b.salary || 0) - (a.salary || 0);
}

function cloneTeams() {
  return TEAMS.map(t => ({ ...t, players: t.players.map(x => ({ ...x })) }));
}

function capForYear(year) {
  let cap = YEAR1_CAP;
  for (let i = 2; i <= year; i++) cap = Math.round(cap * 1.05);
  return cap;
}
function keepCeiling(year) { return capForYear(year) - AUCTION_MIN; }

function nextSalary(pl) {
  if (pl.fa || !hasSal(pl)) return 0;
  return pl.salary * (pl.viaTrade ? 1.05 : 1.08);
}

function roundTot(n) { return Math.round(n); }

function money(n, d = 2) {
  const s = d === 0 ? String(Math.round(n)) : Number(n).toFixed(d);
  return "$" + s.replace(/\.00$/, "");
}

function band(total) {
  return { lo: total * 0.9, hi: total * 1.1, tot: total };
}

function overlaps(a, b) {
  return a.lo <= b.hi && b.lo <= a.hi;
}

function tradeSal(pl) { return pl.fa ? 1 : (pl.salary || 0); }

function pkgTotal(players) {
  return roundTot(players.reduce((s, x) => s + tradeSal(x), 0));
}

function teamById(id) { return S.rosters.find(t => t.id === id); }

function spent(t) { return t.players.filter(hasSal).reduce((s, x) => s + x.salary, 0); }
function faN(t) { return t.players.filter(x => x.fa).length; }

const VE = {
  CATS: ["FG", "FT", "THREE_PM", "PTS", "REB", "AST", "STL", "BLK", "TO"],
  COUNTING: ["fgm", "fga", "ftm", "fta", "threePM", "pts", "reb", "ast", "stl", "blk", "tov", "minutes"],
  FLOOR: -2,
  DRAFTED: 156,
  PREMIUM: 2364,
  MIN_SAL: 1,
  MAX_FA: 15,
  FA_FACTOR: 0.3,
  REPLACEMENT_RANK: 157,
  FINAL_FROM: 145,
  MARKET: [[1, 3, 1.25], [4, 12, 1.15], [13, 24, 1.08], [25, 48, 1], [49, 84, 0.95], [85, 120, 0.85], [121, 144, 0.7]],
  players: [],
  cal: null
};

function veSlug(name) {
  return name.toLowerCase().replace(/'/g, "").replace(/\./g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell);
      if (row.some(x => x !== "")) rows.push(row);
      row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const header = rows[0];
  return rows.slice(1).map(r => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ""])));
}

function vePlayers(rows) {
  return rows.map(r => {
    const name = (r.PLAYER || "").trim();
    return {
      rank: +r.RANK, rankChange: +(r.RANK_CHANGE || 0), name, id: veSlug(name),
      pos: r.POS || "", team: r.TEAM || "", gp: +r.GP, minutes: +r.MPG,
      fgPct: +r.FG_PCT, fgm: +r.FGM, fga: +r.FGA, ftPct: +r.FT_PCT, ftm: +r.FTM, fta: +r.FTA,
      threePM: +r["3PM"], pts: +r.PTS, reb: +r.TREB, ast: +r.AST, stl: +r.STL, blk: +r.BLK, tov: +r.TO,
      total: +r.TOTAL
    };
  });
}

function veFeatures(p, fg, ft) {
  return [p.fgm - p.fga * fg, p.ftm - p.fta * ft, p.threePM, p.pts, p.reb, p.ast, p.stl, p.blk, p.tov];
}

function veScore(p, cal) {
  const x = veFeatures(p, cal.leagueFG, cal.leagueFT);
  let t = 0;
  VE.CATS.forEach((c, i) => {
    const { a, b } = cal.coefficients[c];
    t += (cal.categoryWeights[c] || 1) * Math.max(VE.FLOOR, a + b * x[i]);
  });
  return t;
}

function veScale(p, gp) {
  const s = gp / p.gp;
  const q = { ...p, gp, scaleFactor: s };
  VE.COUNTING.forEach(k => { q[k] = p[k] * s; });
  q.fgPct = q.fga ? q.fgm / q.fga : 0;
  q.ftPct = q.fta ? q.ftm / q.fta : 0;
  return q;
}

function veWeight(rank) {
  if (rank >= VE.FINAL_FROM) return 0;
  for (const [lo, hi, m] of VE.MARKET) if (rank >= lo && rank <= hi) return m;
  return 0;
}

function veAuction(totals) {
  const order = totals.map((t, i) => i).sort((a, b) => totals[b] - totals[a] || a - b);
  const repl = order.length >= VE.REPLACEMENT_RANK ? totals[order[VE.REPLACEMENT_RANK - 1]] : 0;
  const rows = order.map((i, slot0) => {
    const rank = slot0 + 1;
    const surplus = Math.max(0, totals[i] - repl);
    const marketScore = rank <= 144 ? surplus * veWeight(rank) : 0;
    return { index: i, rank, total: totals[i], surplus, marketScore };
  });
  const prem = rows.reduce((s, r) => r.rank <= 144 ? s + r.marketScore : s, 0);
  const dps = prem ? VE.PREMIUM / prem : 0;
  const out = new Array(totals.length);
  for (const r of rows) {
    r.auctionMarketValue = r.rank >= VE.FINAL_FROM ? VE.MIN_SAL : VE.MIN_SAL + r.marketScore * dps;
    r.replacementTotal = repl;
    out[r.index] = r;
  }
  return out;
}

function faSalary(mv) {
  return Math.min(VE.MAX_FA, VE.MIN_SAL + VE.FA_FACTOR * Math.max(0, mv - VE.MIN_SAL));
}

function veFind(id) {
  const q = id.toLowerCase();
  return VE.players.find(p => p.id === q || p.name.toLowerCase() === q);
}

function projectPlayer(id, targetGP) {
  const target = veFind(id);
  if (!target) throw new Error("player");
  if (!(target.gp > 0)) throw new Error("gp");
  const scaled = veScale(target, targetGP);
  const projectedTotal = veScore(scaled, VE.cal);
  const others = VE.players.filter(p => p !== target).map(p => p.total);
  const newRank = 1 + others.filter(t => t > projectedTotal).length;
  const mixed = VE.players.map(p => p === target ? projectedTotal : p.total);
  const econ = veAuction(mixed)[VE.players.indexOf(target)];
  const mv = econ.auctionMarketValue;
  const fa = faSalary(mv);
  return {
    player: target.name,
    playerId: target.id,
    original: { games: target.gp, rank: target.rank, total: target.total },
    projection: {
      games: targetGP,
      scaleFactor: scaled.scaleFactor,
      stats: Object.fromEntries(["fgm", "fga", "ftm", "fta", "threePM", "pts", "reb", "ast", "stl", "blk", "tov"].map(k => [k, scaled[k]])),
      total: projectedTotal,
      rank: newRank
    },
    economics: {
      auctionMarketValue: mv,
      auctionMarketValueRounded: Math.round(mv),
      faSalary: fa,
      faSalaryRounded: Math.round(fa),
      faSalaryCap: VE.MAX_FA,
      marketSurplusIfFA: mv - fa,
      replacementTotal: econ.replacementTotal
    },
    change: { total: projectedTotal - target.total, rank: target.rank - newRank },
    warning: VE.cal.mae >= 0.01
  };
}

function veExplain(res) {
  const o = res.original, p = res.projection, e = res.economics;
  return `${res.player} ${o.games} maçta ${o.total.toFixed(2)} TOTAL ile ${o.rank}. sırada.\n\n`
    + `${p.games} maç projeksiyonunda mevcut maç-başı performansının değişmediği varsayıldı.\n\n`
    + `Ham counting istatistikleri ${p.games}/${o.games} = ${p.scaleFactor.toFixed(4)} katsayısıyla ölçeklendi.\n\n`
    + `FG% ve FT% doğrudan çarpılmadı; şut hacmi dikkate alınarak weighted percentage impact yeniden hesaplandı.\n\n`
    + `Ardından her kategori kalibre edilmiş z-score benzeri değer fonksiyonundan geçirildi ve H2H negatif kategori floor'u uygulandı.\n\n`
    + `Son projected TOTAL yaklaşık ${p.total.toFixed(2)} oldu. Bu değer mevcut oyuncu havuzuna yerleştirildiğinde yaklaşık ${p.rank}. sıraya karşılık geliyor.\n\n`
    + `Auction market value ≈ $${e.auctionMarketValue.toFixed(2)} ($${e.auctionMarketValueRounded}). `
    + `FA maaşı = min(15, 1 + 0.30×(MV−1)) ≈ $${e.faSalary.toFixed(2)} ($${e.faSalaryRounded}).`;
}

function veCheck() {
  const b = projectPlayer("dejounte-murray", 64);
  if (Math.abs(b.projection.total - 16.98) > 0.05 || b.projection.rank !== 42) throw new Error("dejounte proj");
  if (faSalary(80) !== 15) throw new Error("fa cap");
  const n = projectPlayer("nickeil-alexander-walker", 65);
  if (Math.abs(n.projection.total - 17.97) > 0.15 || Math.abs(n.projection.rank - 34) > 2) throw new Error("nickeil");
  if (n.economics.faSalaryRounded !== 8) throw new Error("nickeil fa");
}

      fetch("calibration.json").then(r => { if (!r.ok) throw new Error("cal"); return r.json(); })

  if (S.fa.err && !VE.cal) return `<p class="sub">${esc(S.fa.err)}</p>`;

  const warn = VE.cal && VE.cal.mae >= 0.01
    ? `<div class="warn">Kalibrasyon MAE ${VE.cal.mae.toFixed(4)} — hedef &lt; 0.01. Sonuca ihtiyatlı bak.</div>`
    : "";

function render() {

function boardArrow(k) {
  if (S.board.sort !== k) return "";
  return S.board.dir < 0 ? " ▼" : " ▲";
}

function boardList() {
  const q = S.board.q.trim().toLocaleLowerCase("tr");
  const min = S.board.min === "" || Number.isNaN(Number(S.board.min)) ? null : Number(S.board.min);
  const max = S.board.max === "" || Number.isNaN(Number(S.board.max)) ? null : Number(S.board.max);
  const rows = [];
  for (const t of S.rosters) for (const p of t.players) {
    if (S.board.team && t.id !== S.board.team) continue;
    if (q && !p.name.toLocaleLowerCase("tr").includes(q)) continue;
    const nxt = nextSalary(p);
    if (min != null && !(nxt > 0 && nxt >= min)) continue;
    if (max != null && !(nxt > 0 && nxt <= max)) continue;
    rows.push({ t, p });
  }
  const dir = S.board.dir, k = S.board.sort;
  rows.sort((a, b) => {
    let c = 0;
    if (k === "name") c = a.p.name.localeCompare(b.p.name, "tr");
    else if (k === "team") c = a.t.name.localeCompare(b.t.name, "tr");
    else if (k === "sal") c = (hasSal(a.p) ? a.p.salary : -1) - (hasSal(b.p) ? b.p.salary : -1);
    else c = (nextSalary(a.p) || -1) - (nextSalary(b.p) || -1);
    return c * dir;
  });
  return rows;
}

function boardHtml() {
  const rows = boardList();
  const list = rows.length
    ? rows.map(({ t, p }) =>
      `<button class="brow" data-act="find" data-tid="${esc(t.id)}" data-pid="${esc(p.id)}"><span>${esc(p.name)}</span><span class="tm">${esc(t.name)}</span><span class="sal">${hasSal(p) ? money(p.salary, 0) : "FA"}</span><span class="next">${(n => n ? money(n) : "—")(nextSalary(p))}</span></button>`
    ).join("")
    : `<div class="empty muted">Yok</div>`;
  if (!S.board.team) return list;
  const raw = rows.reduce((s, { p }) => s + nextSalary(p), 0);
  return list + `<div class="board-tot"><span>Toplam</span><span></span><span></span><span class="next">${money(roundTot(raw), 0)}</span></div>`;
}

function drawBoard() {
  const box = document.getElementById("board-list");

}

function viewTut() {
  const t = teamById(S.teamId);
  const set = keepSet(t.id);
  const kept = t.players.filter(x => set.has(x.id) && hasSal(x));
  const raw = kept.reduce((s, x) => s + nextSalary(x), 0);
  const tot = roundTot(raw);
  const cap = capForYear(2);
  const auction = cap - tot;
  const full = set.size === KEEP_N;
  const dropped = t.players.filter(x => !set.has(x.id));
  return `
    <div class="toolbar">
      <select data-act="team">${S.rosters.map(x => `<option value="${x.id}" ${x.id===t.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>

    </div>

      <div class="stat ${set.size===KEEP_N?"ok":"bad"}"><span class="muted">Tutulan</span><b>${set.size}/${KEEP_N}</b></div>
      <div class="stat ${tot > keepCeiling(2)?"bad":""}"><span class="muted">Tutulan toplam</span><b>${money(tot,0)}</b><div class="hint">En fazla ${money(keepCeiling(2),0)} · kuruşlu ${raw.toFixed(2)}</div></div>
      <div class="stat ${auction>=AUCTION_MIN?"ok":"bad"}"><span class="muted">Kalan bütçe</span><b>${money(auction,0)}</b><div class="hint">Tavan ${money(cap,0)} · en az ${money(AUCTION_MIN,0)}</div></div>
    </div>
    <div class="plist">${[...t.players].sort(bySal).map(x => {
      const on = set.has(x.id);
      const dim = x.fa || (!on && full);
      const nxt = hasSal(x) && !x.fa ? money(nextSalary(x)) : "—";
      const tags = [
        x.viaTrade ? '<span class="tag">TAKAS +%5</span>' : "",
        x.fa ? (hasSal(x) ? '<span class="tag fa">FA · $1</span>' : '<span class="tag fa">FA · fiyat yok</span>') : ""
      ].join(" ");
      return `<button class="prow ${on?"on":""} ${dim?"dim":""}" data-act="keep" data-id="${esc(x.id)}">
        <div class="ck">${on?"✓":""}</div>
        <div><div class="nm">${esc(x.name)} ${tags}</div>
          <div class="muted">${x.nba} · ${x.pos}</div></div>
        <div class="sal">${hasSal(x) ? money(x.salary,0) : "—"}</div>
        <div class="next">${nxt}</div>
      </button>`;
    }).join("")}</div>
    ${full ? `<div class="drop"><h3>Tutulmayanlar</h3>
      <div class="muted">${dropped.slice().sort(bySal).map(x => esc(x.name) + " " + (hasSal(x) ? money(x.salary,0) : "FA")).join(" · ")}</div></div>` : `<p class="sub" style="margin-top:14px">Soldaki bu sezonki maaş, sağdaki gelecek sezon. FA tutulamaz.</p>`}`;
}

function afterSpent(team, give, take) {
  return spent(team)
    - give.reduce((s, x) => s + (hasSal(x) ? x.salary : 0), 0)
    + take.reduce((s, x) => s + tradeSal(x), 0);
}

function inKeep(take) {
  return roundTot(take.filter(x => hasSal(x) && !x.fa).reduce((s, x) => s + x.salary * 1.05, 0));
}

function viewTakas() {
  const a = teamById(S.tradeA);
  const b = teamById(S.tradeB);
  const pa = a.players.filter(x => S.pickA.has(x.id));
  const pb = b.players.filter(x => S.pickB.has(x.id));
  const ta = pkgTotal(pa);
  const tb = pkgTotal(pb);
  const ba = band(ta), bb = band(tb);
  const ok = pa.length && pb.length && overlaps(ba, bb);
  const empty = !pa.length || !pb.length;
  const ca = a.players.filter(x => S.coreA.has(x.id));
  const cb = b.players.filter(x => S.coreB.has(x.id));
  const coreGap = ca.length && cb.length && !tradeOk(ca, cb);
  const after = empty ? "" : `<div class="after">
      Bu sezon ${esc(a.name)} ${money(spent(a),0)} → ${money(afterSpent(a, pa, pb),0)} · ${esc(b.name)} ${money(spent(b),0)} → ${money(afterSpent(b, pb, pa),0)}
      <div class="hint">Gelenler tutulursa ${esc(a.name)} ${money(inKeep(pb),0)} · ${esc(b.name)} ${money(inKeep(pa),0)}</div>
    </div>`;
  return `
    <p class="sub">Paket toplamları toplanır, sonra yuvarlanır. ±%10 bantları kesişirse takas uygun. FA takasta $1.</p>
    <div class="cols">
      ${side(a, "A")}
      ${side(b, "B")}
    </div>
    <div class="verdict ${empty ? "" : ok ? "yes" : "no"}">
      <h3>${empty ? "Oyuncu seç" : ok ? "Uygun" : "Uygun değil"}</h3>
      <div class="bands">
        <span>${esc(a.name)} ${money(ta,0)} → [${fmtBand(ba.lo)} – ${fmtBand(ba.hi)}]</span>
        <span>${esc(b.name)} ${money(tb,0)} → [${fmtBand(bb.lo)} – ${fmtBand(bb.hi)}]</span>
      </div>
      ${lineSvg(ba, bb)}
      ${after}
      ${!empty ? `<button class="ghost" data-act="copy-trade">Kopyala</button>` : ""}
      ${coreGap ? tradeTipsHtml(a, ca, b, cb) : ""}
    </div>`;
}

function side(team, which) {
  const picks = which === "A" ? S.pickA : S.pickB;
  const other = which === "A" ? S.tradeB : S.tradeA;
  return `<div class="side">
    <select data-act="trade-team" data-which="${which}">${S.rosters.map(x =>
      `<option value="${x.id}" ${x.id===team.id?"selected":""} ${x.id===other?"disabled":""}>${esc(x.name)}</option>`
    ).join("")}</select>
    <div class="plist">${[...team.players].sort(bySal).map(x => {
      const on = picks.has(x.id);
      return `<button class="prow ${on?"on":""}" data-act="pick" data-which="${which}" data-id="${esc(x.id)}">
        <div class="ck">${on?"✓":""}</div>
        <div><div class="nm">${esc(x.name)} ${x.fa ? '<span class="tag fa">FA · $1</span>' : ""}</div><div class="muted">${x.nba} · ${x.pos}</div></div>
        <div class="sal">${money(tradeSal(x),0)}</div>
        <div></div>
      </button>`;
    }).join("")}</div>
  </div>`;
}

function fmtBand(n) { return money(Math.round(n * 10) / 10, n % 1 ? 1 : 0); }

function tradeOk(na, nb) {
  return na.length && nb.length && overlaps(band(pkgTotal(na)), band(pkgTotal(nb)));
}

function tradeTipsList(a, pa, b, pb) {
  const tips = [];
  const seen = new Set();
  const idsA = new Set(pa.map(x => x.id));
  const idsB = new Set(pb.map(x => x.id));
  const poolA = a.players.filter(x => !idsA.has(x.id));
  const poolB = b.players.filter(x => !idsB.has(x.id));
  const add = (key, nAdd, label, extrasA, extrasB) => {
    const na = pa.concat(extrasA), nb = pb.concat(extrasB);
    if (seen.has(key) || !tradeOk(na, nb)) return;
    seen.add(key);
    tips.push({ nAdd, gap: Math.abs(pkgTotal(na) - pkgTotal(nb)), label: `${label} → ${money(pkgTotal(na),0)} / ${money(pkgTotal(nb),0)}`, addA: extrasA.map(p => p.id), addB: extrasB.map(p => p.id) });
  };
  for (const p of poolB) add("b+" + p.id, 1, `${b.name}: ${p.name} ekle (${money(tradeSal(p),0)})`, [], [p]);
  for (const p of poolA) add("a+" + p.id, 1, `${a.name}: ${p.name} ekle (${money(tradeSal(p),0)})`, [p], []);
  for (const p of poolA) for (const q of poolB)
    add("ab+" + p.id + q.id, 2, `${a.name}: ${p.name} ekle (${money(tradeSal(p),0)}) · ${b.name}: ${q.name} ekle (${money(tradeSal(q),0)})`, [p], [q]);
  // ponytail: 2-add O(n²) on ~13-player rosters; 3-add only if 1–2 never overlap
  for (let i = 0; i < poolB.length; i++) for (let j = i + 1; j < poolB.length; j++)
    add("bb+" + poolB[i].id + poolB[j].id, 2, `${b.name}: ${poolB[i].name} ve ${poolB[j].name} ekle`, [], [poolB[i], poolB[j]]);
  for (let i = 0; i < poolA.length; i++) for (let j = i + 1; j < poolA.length; j++)
    add("aa+" + poolA[i].id + poolA[j].id, 2, `${a.name}: ${poolA[i].name} ve ${poolA[j].name} ekle`, [poolA[i], poolA[j]], []);
  tips.sort((x, y) => x.nAdd - y.nAdd || x.gap - y.gap);
  return tips;
}

function tradeTipsHtml(a, pa, b, pb) {
  const tips = tradeTipsList(a, pa, b, pb);
  if (!tips.length) return `<div class="tips"><h4>Nasıl denkleşir</h4><div class="tip">Bu çekirdekle ±%10 kesişimi yok.</div></div>`;
  const i = ((S.tipI % tips.length) + tips.length) % tips.length;
  return `<div class="tips"><h4>Nasıl denkleşir</h4>
    <div class="tips-row">
      <div class="tip">${esc(tips[i].label)}</div>
      <button class="ghost" data-act="next-tip">Yeni öneri</button>
    </div></div>`;
}

function applyTip() {
  const a = teamById(S.tradeA), b = teamById(S.tradeB);
  const pa = a.players.filter(x => S.coreA.has(x.id));
  const pb = b.players.filter(x => S.coreB.has(x.id));
  const tips = tradeTipsList(a, pa, b, pb);
  if (!tips.length) return;
  const t = tips[((S.tipI % tips.length) + tips.length) % tips.length];
  S.pickA = new Set([...S.coreA, ...t.addA]);
  S.pickB = new Set([...S.coreB, ...t.addB]);
}

function nextTip() {
  if (S.tipOn) S.tipI++;
  else S.tipOn = true;
  applyTip();
}

function lockCore() {
  S.coreA = new Set(S.pickA);
  S.coreB = new Set(S.pickB);
  S.tipOn = false;
  S.tipI = 0;
}

function lineSvg(ba, bb) {
  if (!ba.tot && !bb.tot) return "";
  const lo = Math.min(ba.lo, bb.lo);
  const hi = Math.max(ba.hi, bb.hi);
  const span = hi - lo || 1;
  const pct = x => ((x - lo) / span) * 100;
  const ovLo = Math.max(ba.lo, bb.lo);
  const ovHi = Math.min(ba.hi, bb.hi);
  const hit = ovLo <= ovHi;
  return `<div class="line">
    <div class="track"></div>
    <div class="rng a" style="left:${pct(ba.lo)}%;width:${pct(ba.hi)-pct(ba.lo)}%"></div>
    <div class="rng b" style="left:${pct(bb.lo)}%;width:${pct(bb.hi)-pct(bb.lo)}%"></div>
    ${hit ? `<div class="ov" style="left:${pct(ovLo)}%;width:${pct(ovHi)-pct(ovLo)}%"></div>` : ""}
  </div>`;
}

function resetDraft() {
  S.rosters = cloneTeams();
  S.keepers = {};
  S.pickA.clear(); S.pickB.clear();
  S.coreA.clear(); S.coreB.clear();
  S.tipOn = false;
  S.tipI = 0;
  save();
  toast("Kadrolar sıfırlandı");
}

document.addEventListener("click", e => {
  if (!e.target.closest(".find")) hideHits();
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "view") S.view = t.dataset.v;
  else if (act === "open-tut") { S.teamId = t.dataset.id; S.view = "tut"; }
  else if (act === "keep") toggleKeep(S.teamId, t.dataset.id);
  else if (act === "pick") {
    const set = t.dataset.which === "A" ? S.pickA : S.pickB;
    if (set.has(t.dataset.id)) set.delete(t.dataset.id); else set.add(t.dataset.id);
    lockCore();
  }
  else if (act === "next-tip") nextTip();
  else if (act === "find") openFind(t.dataset.tid, t.dataset.pid);
  else if (act === "board-sort") {
    const k = t.dataset.k;
    if (S.board.sort === k) S.board.dir *= -1;
    else { S.board.sort = k; S.board.dir = (k === "name" || k === "team") ? 1 : -1; }
  }
  else if (act === "copy-trade") { const s = tradeLine(); if (s) copyText(s); return; }
  else if (act === "copy-keep") { const s = keepLine(); if (s) copyText(s); return; }
  else if (act === "gm") setGm(t.dataset.id);
  else if (act === "gate") { showGate(); return; }
  else if (act === "fa-pick") {
    const p = veFind(t.dataset.id);
    if (p) S.fa.q = p.name;
    runFa(t.dataset.id);
  }
  else if (act === "reset") resetDraft();
  else return;
  render();
  if (act === "find" && t.dataset.pid) {
    const el = document.querySelector(`[data-act="pick"][data-id="${CSS.escape(t.dataset.pid)}"]`);
    el?.scrollIntoView({ block: "nearest" });
  }
});

document.getElementById("q").addEventListener("input", drawHits);

document.addEventListener("input", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "board-q") S.board.q = t.value;
  else if (t.dataset.act === "board-min") S.board.min = t.value;
  else if (t.dataset.act === "board-max") S.board.max = t.value;
  else if (t.dataset.act === "fa-q") {
    S.fa.q = t.value;
    const box = document.getElementById("fa-hits");
    if (box) {
      const rosterFa = new Set();
      for (const tm of S.rosters) for (const p of tm.players) if (p.fa) rosterFa.add(p.name.toLowerCase());
      const hits = faHits();
      box.innerHTML = hits.length ? `<div class="fa-hits">${hits.map(p =>
        `<button data-act="fa-pick" data-id="${esc(p.id)}" class="${S.fa.pick===p.id?"on":""}"><span>${esc(p.name)}${rosterFa.has(p.name.toLowerCase()) ? ' <span class="tag fa">FA</span>' : ""}</span><span class="muted">${p.gp} GP · ${p.rank}. · ${p.total.toFixed(2)}</span></button>`
      ).join("")}</div>` : (S.fa.q.trim().length >= 2 ? `<p class="muted">Yok</p>` : "");
    }
    return;
  } else if (t.dataset.act === "fa-gp") {
    S.fa.gp = t.value;
    if (S.fa.pick) { runFa(S.fa.pick); render(); document.getElementById("fa-gp")?.focus(); }
    return;
  }
  else return;
  drawBoard();
});

document.addEventListener("change", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "team") S.teamId = t.value;
  else if (t.dataset.act === "board-team") { S.board.team = t.value; drawBoard(); return; }
  else if (t.dataset.act === "trade-team") {
    const which = t.dataset.which;
    if (which === "A") { S.tradeA = t.value; S.pickA.clear(); S.coreA = new Set(); S.pickB = new Set(S.coreB); }
    else { S.tradeB = t.value; S.pickB.clear(); S.coreB = new Set(); S.pickA = new Set(S.coreA); }
    S.tipOn = false;
    S.tipI = 0;
  } else return;
  render();
});

function selfCheck() {
  const ok120 = overlaps(band(100), band(120));
  const no130 = !overlaps(band(100), band(130));
  const r1 = Math.round(18.4) === 18;
  const r2 = Math.round(18.5) === 19;
  const cap = capForYear(2) === 210 && capForYear(3) === 221;
  const wembyKeep = roundTot(91 * 1.08) === 98;
  const faSkip = pkgTotal([{ salary: 50, fa: false }, { salary: null, fa: true }]) === 51;
  const keepFa = nextSalary({ fa: true, salary: 1 }) === 0;
  const keepMax = keepCeiling(2) === 206;
  const tips = tradeTipsList(
    { name: "A", players: [{ id: "w", name: "Wemby", salary: 91 }, { id: "g", name: "Giddey", salary: 32 }] },
    [{ id: "w", name: "Wemby", salary: 91 }],
    { name: "B", players: [{ id: "c", name: "Cade", salary: 54 }, { id: "t", name: "Tatum", salary: 29 }] },
    [{ id: "c", name: "Cade", salary: 54 }]
  );
  const addOnly = tips.length && tips.every(t => t.label.includes("ekle") && !t.label.includes("çıkar")) && tips.some(t => t.addB.includes("t"));
  if (!(ok120 && no130 && r1 && r2 && cap && wembyKeep && faSkip && keepFa && keepMax && addOnly)) throw new Error("keeper math failed");
}
selfCheck();
loadEngine();
if (S.gmId) {
  S.teamId = S.gmId;
  S.tradeB = S.gmId;
  if (S.tradeA === S.gmId) S.tradeA = S.rosters.find(x => x.id !== S.gmId).id;
  document.getElementById("gm").textContent = teamById(S.gmId).name;
} else showGate();
render();
